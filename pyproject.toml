[project]
name = "books-to-scrape"
version = "0.1.0"
description = "Playwright + Pytest UI automation framework for Books to Scrape"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "allure-pytest>=2.16.2",
    "pytest-html>=4.2.0",
    "pytest-playwright>=0.10.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
